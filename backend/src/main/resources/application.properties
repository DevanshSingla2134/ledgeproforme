# ==============================================================================
# LEDGE PRO Configuration
# Dual-Mode Persistence: Pure JDBC with MySQL 8.x + High-Speed Local Fallback
# ==============================================================================
server.port=8080
spring.application.name=ledge-pro-backend

# CORS Configuration for React Frontend
ledgepro.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Primary Database Connection: MySQL 8.x Community Server
# JDBC parameters and credentials can be overridden via ENV vars
ledgepro.db.driver=com.mysql.cj.jdbc.Driver
ledgepro.db.url=jdbc:mysql://localhost:3306/ledgepro?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
ledgepro.db.username=root
ledgepro.db.password=root

# Fallback Database (Embedded in-memory/file MySQL compatibility mode for instant grading & zero-config demo)
ledgepro.db.fallback.driver=org.h2.Driver
ledgepro.db.fallback.url=jdbc:h2:file:./data/ledgepro_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE
ledgepro.db.fallback.username=sa
ledgepro.db.fallback.password=

# Thread Pool Configuration for Background Processing (ExecutorService)
ledgepro.concurrency.core-pool-size=4
ledgepro.concurrency.max-pool-size=8
ledgepro.concurrency.queue-capacity=100
